<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتيجة الاستعلام</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
            border-top: 8px solid #3498db;
        }
        .name { color: #2c3e50; font-size: 24px; margin-bottom: 5px; }
        .id { color: #7f8c8d; font-size: 16px; margin-bottom: 20px; }
        .result-box {
            background: #e8f4fd;
            padding: 20px;
            border-radius: 10px;
            font-size: 32px;
            font-weight: bold;
            color: #2980b9;
            margin-top: 10px;
        }
        .status { margin-top: 15px; font-weight: bold; }
        .success { color: #27ae60; }
    </style>
</head>
<body>

    <div class="card">
        <div class="name" id="userName">جاري التحميل...</div>
        <div class="id">رقم الجلوس: <span id="userId">0000</span></div>
        <hr>
        <div class="result-box" id="userScore">--</div>
        <div class="status success" id="userStatus">حالة النتيجة: معتمدة</div>
    </div>

    <script>
        // كود سحب البيانات من اللينك
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name') || "اسم غير معروف";
        const id = urlParams.get('id') || "0000";
        const score = urlParams.get('score') || "لا يوجد";

        // وضع البيانات في الصفحة
        document.getElementById('userName').innerText = name;
        document.getElementById('userId').innerText = id;
        document.getElementById('userScore').innerText = score;
    </script>

</body>
</html>
